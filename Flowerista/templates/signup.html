{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Flowerista</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header>
    <a href="{% url 'home' %}" class="logo">🌸 Flowerista</a>
    <nav>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'login' %}">Login</a>
    </nav>
  </header>

  <main class="container">
    <div class="auth-card">
      <h2>Join Flowerista ✨</h2>

      {% if errors %}
        <div style="color: #e63946; background: #ffe6e6; padding: 0.5rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem;">
          {% for field, error_list in errors.items %}
            {% for error in error_list %}
              <p>• {{ error }}</p>
            {% endfor %}
          {% endfor %}
        </div>
      {% endif %}

      <form method="POST" action="{% url 'signup' %}">
        {% csrf_token %}
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required placeholder="Choose a username">
        </div>

        <div class="form-group">
          <label for="password1">Password</label>
          <input type="password" id="password1" name="password1" required placeholder="••••••••">
        </div>

        <div class="form-group">
          <label for="password2">Confirm Password</label>
          <input type="password" id="password2" name="password2" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-primary btn-yellow" style="width: 100%; margin-top: 1rem;">Create Account</button>
      </form>
      <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
        Already have an account? <a href="{% url 'login' %}" style="color: var(--primary-pink); font-weight: bold;">Log In</a>
      </p>
    </div>
  </main>
</body>
</html>
