{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Flowerista</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header>
    <a href="{% url 'home' %}" class="logo">🌸 Flowerista</a>
    <nav>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'signup' %}">Sign Up</a>
    </nav>
  </header>

  <main class="container">
    <div class="auth-card">
      <h2>Welcome Back! 🌸</h2>
      
      {% if errors %}
        <p style="color: #e63946; background: #ffe6e6; padding: 0.5rem; border-radius: 8px; text-align: center; font-size: 0.9rem; margin-bottom: 1rem;">
          {{ errors }}
        </p>
      {% endif %}

      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required placeholder="Enter your username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
      </form>
      <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
        Don't have an account? <a href="{% url 'signup' %}" style="color: var(--primary-pink); font-weight: bold;">Sign Up</a>
      </p>
    </div>
  </main>
</body>
</html>
